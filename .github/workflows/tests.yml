name: Tensor regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      # These suites do not need Isaac Lab, robot assets, a display, or a GPU.
      - run: python -m unittest tools.test_go2 tools.test_go2_guarded -v
